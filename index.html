<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 텍스트 레이어 에디터</title>
<style>
  :root{
    --bg:#111417; --panel:#1a1f24; --panel2:#20262c;
    --line:#2c343c; --ink:#e8ecef; --sub:#8a949e;
    --accent:#4fd1a5; --accent-ink:#0c211a; --warn:#f6c453;
    --mono:'SF Mono',Consolas,'Malgun Gothic',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'Pretendard','Malgun Gothic',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
  header h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
  header .badge{font:11px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 8px}
  header .res{margin-left:auto;font:12px var(--mono);color:var(--sub)}
  header .userbar{display:flex;align-items:center;gap:8px;margin-left:14px}
  header .userbar img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
  header .userbar .who{font-size:12px;color:var(--sub);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .userbar a,header .userbar .ghost{
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-decoration:none
  }
  header .userbar .ghost{cursor:pointer;font-family:inherit}
  #appShell{display:none;flex:1;flex-direction:column;min-height:0}
  body.ready #appShell{display:flex}
  #gate{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
  body.ready #gate{display:none}
  .gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;text-align:center}
  .gate-card h2{font-size:20px;margin-bottom:8px}
  .gate-card p{color:var(--sub);font-size:13px;line-height:1.7}
  .gate-card .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:18px auto}
  #googleBtn{display:flex;justify-content:center;margin-top:20px;min-height:44px}
  .gate-card .status{display:inline-block;margin-top:14px;font:11px var(--mono);color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:3px 10px}

  main{flex:1;display:flex;min-height:0}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;position:relative}
  #dropzone{border:2px dashed var(--line);border-radius:12px;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.2s;text-align:center;padding:20px}
  #dropzone:hover,#dropzone.drag{border-color:var(--accent);background:rgba(79,209,165,.04)}
  #dropzone .big{font-size:38px}
  #dropzone p{color:var(--sub)}
  #dropzone strong{color:var(--ink)}
  #canvasWrap{display:none;max-width:100%;max-height:100%;position:relative}
  #canvas{max-width:100%;max-height:calc(100vh - 160px);display:block;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5)}

  .box{position:absolute;border:1.5px solid var(--accent);border-radius:3px;cursor:move;background:rgba(79,209,165,.06)}
  .box .tag{position:absolute;top:-19px;left:-1px;background:var(--accent);color:var(--accent-ink);font:10px/1 var(--mono);padding:3px 6px;border-radius:3px;font-weight:700;pointer-events:none}
  .box .grip{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--accent);border-radius:50%;cursor:nwse-resize}
  .box.edited{border-color:var(--warn);background:rgba(246,196,83,.08)}
  .box.edited .tag,.box.edited .grip{background:var(--warn)}

  #loading{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(17,20,23,.85);z-index:5;border-radius:12px}
  #loading .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loading span{font:12px var(--mono);color:var(--sub)}

  aside{width:340px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  aside .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  aside .head h2{font-size:13px;font-weight:700}
  aside .head small{font:11px var(--mono);color:var(--sub)}
  .cmd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .cmd label{font-size:12px;font-weight:700;color:var(--accent)}
  .cmd textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;resize:vertical;outline:none;font-family:inherit}
  .cmd textarea:focus{border-color:var(--accent)}
  .cmd select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none;font-family:inherit;cursor:pointer}
  .cmd select:focus{border-color:var(--accent)}
  #btnCommand{background:var(--accent);color:var(--accent-ink);padding:9px}
  #btnJoin{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:9px;display:none}
  .hint{font-size:11px;color:var(--sub);padding:8px 16px;border-bottom:1px solid var(--line);line-height:1.6}
  #layers{flex:1;overflow-y:auto;padding:10px}
  #layers:empty::after{content:"이미지를 업로드하면\AAI가 텍스트를 읽어 레이어로 표시합니다";white-space:pre;display:block;text-align:center;color:var(--sub);padding:40px 0;font-size:12px;line-height:1.8}

  .layer{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;transition:border-color .15s}
  .layer.edited{border-color:var(--warn)}
  .layer .row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .layer .num{font:10px var(--mono);font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:3px;padding:2px 6px}
  .layer.edited .num{background:var(--warn)}
  .layer .orig{font:11px var(--mono);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .layer input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none}
  .layer input:focus{border-color:var(--accent)}
  .layer input::placeholder{color:#5c666f}
  .layer .ord{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .layer .ord button{background:var(--bg);color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:10px;line-height:16px;min-width:22px}
  .layer .ord button:hover{color:var(--accent);border-color:var(--accent)}
  .layer .ord button:disabled{opacity:.25}
  .layer .del{flex-shrink:0;background:var(--bg);color:#f07178;border:1px solid var(--line);border-radius:4px;padding:0 7px;font-size:12px;line-height:22px;min-width:26px}
  .layer .del:hover{border-color:#f07178;color:#ff9aa0}

  .actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  button{border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s,opacity .15s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.35;cursor:default}
  #btnReset{background:var(--panel2);color:var(--sub);border:1px solid var(--line)}
  #btnDownload{background:var(--warn);color:#231a04;display:none}

  @media (max-width:760px){
    main{flex-direction:column}
    aside{width:100%;border-left:none;border-top:1px solid var(--line);max-height:45vh}
    #canvas{max-height:40vh}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card" id="gateCard">
    <h2>이미지 텍스트 레이어 에디터</h2>
    <p id="gateMsg">로그인 상태를 확인하는 중…</p>
    <div class="spin" id="gateSpin"></div>
    <div id="googleBtn" style="display:none"></div>
    <button type="button" id="gateLogout" class="ghost" style="display:none;margin:18px auto 0;background:#20262c;color:#8a949e;border:1px solid #2c343c;border-radius:8px;padding:8px 14px;font-size:12px">다른 계정으로</button>
  </div>
</div>

<div id="appShell">
<header>
  <h1>이미지 텍스트 레이어 에디터</h1>
  <span class="badge">AI 인식 · 원본 해상도 유지</span>
  <span class="res" id="resInfo"></span>
  <div class="userbar" id="userbar">
    <a id="adminLink" href="/admin.html" style="display:none">관리자 콘솔</a>
    <img id="userPic" alt="" style="display:none">
    <span class="who" id="userName"></span>
    <button type="button" class="ghost" id="btnLogout">로그아웃</button>
  </div>
</header>

<main>
  <div id="stage">
    <div id="dropzone">
      <div class="big">🖼️</div>
      <p><strong>이미지를 드래그하거나 클릭해서 업로드</strong></p>
      <p>디자인 폰트·배너 텍스트도 AI가 읽습니다 (한국어·영어)</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div id="overlay" style="position:absolute;inset:0;display:block;padding:3%"></div>
    </div>
    <div id="loading">
      <div class="spin"></div>
      <span id="loadMsg">AI가 텍스트를 읽는 중…</span>
    </div>
  </div>

  <aside>
    <div class="head">
      <h2>텍스트 레이어</h2>
      <small id="layerCount"></small>
    </div>
    <div class="cmd">
      <label>🌐 언어 지정 — 바꿀 언어 선택</label>
      <select id="cmdLang">
        <option value="일본어로 (Japanese)">일본어</option>
        <option value="번체 중국어로 (Traditional Chinese)">중국어 (번체)</option>
        <option value="간체 중국어로 (Simplified Chinese)">중국어 (간체)</option>
        <option value="영어로 (English)">영어</option>
        <option value="태국어로 (Thai)">태국어</option>
        <option value="러시아어로 (Russian)">러시아어</option>
        <option value="인도네시아어로 (Indonesian)">인도네시아어</option>
        <option value="__custom__">✏️ 직접 입력…</option>
      </select>
      <textarea id="cmdInput" rows="1" placeholder="예: 베트남어로 / 스페인어로" style="display:none;margin-top:8px"></textarea>
      <button id="btnCommand" disabled>AI로 생성하기</button>
      <button type="button" id="btnJoin">겹친 단어 붙이기</button>
    </div>
    <div class="hint">💡 박스가 겹치면 <b>겹친 단어 붙이기</b>로 한 줄로 이어 붙입니다. 색·효과는 레이어마다 따로 유지됩니다. 생성할 때도 겹친 박스는 자동으로 붙습니다. ▲▼는 왼쪽→오른쪽 순서입니다.</div>
    <div id="layers"></div>
    <div class="actions">
      <button id="btnDownload">⬇ 이미지 다운로드 (원본 해상도)</button>
      <button id="btnReset" disabled>원본으로 되돌리기</button>
    </div>
  </aside>
</main>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
let img=new Image(), lines=[], linesBackup=[], originalName='image', imageJob=null, currentUser=null;

function apiFetch(url, opts={}){
  return fetch(url, Object.assign({credentials:'include'}, opts));
}
function showGate(msg, spin, google, wait){
  document.body.classList.remove('ready');
  $('gateMsg').textContent=msg;
  $('gateSpin').style.display=spin?'block':'none';
  $('googleBtn').style.display=google?'flex':'none';
  $('gateLogout').style.display=wait?'inline-block':'none';
  document.querySelectorAll('#gateCard .status').forEach(n=>n.remove());
}
function applyUser(user){
  currentUser=user;
  if(!user){ showGate('구글 계정으로 로그인한 뒤, 관리자 승인이 있어야 편집을 시작할 수 있습니다.', false, true, false); return; }
  if(user.status==='pending'){
    showGate('가입 요청이 전달되었습니다. 관리자가 승인하면 이 페이지를 사용할 수 있습니다.', false, false, true);
    $('gateMsg').insertAdjacentHTML('afterend','<div class="status">승인 대기</div>');
    return;
  }
  if(user.status!=='approved'){
    showGate('관리자가 이 계정의 접근을 거절했습니다.', false, false, true);
    return;
  }
  document.body.classList.add('ready');
  $('userName').textContent=user.name||user.email;
  if(user.picture){ $('userPic').src=user.picture; $('userPic').style.display='block'; }
  $('adminLink').style.display=user.role==='admin'?'inline-flex':'none';
}
async function bootAuth(){
  try{
    const me=await apiFetch('/api/auth/me');
    if(me.ok){ applyUser((await me.json()).user); return; }
  }catch{}
  showGate('구글 계정으로 로그인한 뒤, 관리자 승인이 있어야 편집을 시작할 수 있습니다.', false, true);
  const cfg=await apiFetch('/api/auth/config').then(r=>r.json()).catch(()=>({}));
  if(!cfg.googleClientId){
    $('gateMsg').textContent='GOOGLE_CLIENT_ID와 ADMIN_EMAIL, SESSION_SECRET 환경변수를 설정한 뒤 다시 열어주세요.';
    return;
  }
  const start=()=>{
    if(!window.google?.accounts?.id) return false;
    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: async ev=>{
        showGate('로그인 중…', true, false);
        try{
          const r=await apiFetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:ev.credential})});
          const data=await r.json();
          if(!r.ok) throw new Error(data.error||'로그인 실패');
          applyUser(data.user);
        }catch(err){ showGate(err.message, false, true); renderGoogleBtn(cfg.googleClientId); }
      }
    });
    renderGoogleBtn(cfg.googleClientId);
    return true;
  };
  if(!start()){
    let n=0; const t=setInterval(()=>{ if(start()||++n>40) clearInterval(t); }, 200);
  }
}
function renderGoogleBtn(clientId){
  $('googleBtn').innerHTML='';
  $('googleBtn').style.display='flex';
  google.accounts.id.renderButton($('googleBtn'),{theme:'filled_black',size:'large',text:'signin_with',width:320});
}
$('btnLogout').onclick=logout;
$('gateLogout').onclick=logout;
async function logout(){
  await apiFetch('/api/auth/logout',{method:'POST'});
  location.reload();
}
bootAuth();

/* ── 업로드 ── */
const dz=$('dropzone');
dz.onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); };
['dragover','dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{
  e.preventDefault();
  dz.classList.toggle('drag',ev==='dragover');
  if(ev==='drop'&&e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
}));

function loadFile(file){
  originalName=file.name.replace(/\.[^.]+$/,'');
  imageJob={id:crypto.randomUUID(), fileName:file.name, bytes:file.size, width:0, height:0};
  img=new Image();
  img.onload=()=>{
    canvas.width=img.naturalWidth;   // ★ 원본 해상도 그대로
    canvas.height=img.naturalHeight;
    imageJob.width=img.naturalWidth;
    imageJob.height=img.naturalHeight;
    ctx.drawImage(img,0,0);
    $('resInfo').textContent=img.naturalWidth+' × '+img.naturalHeight+'px';
    dz.style.display='none';
    $('canvasWrap').style.display='block';
    $('overlay').style.display='block';
    $('btnDownload').style.display='none';
    runAI();
    $('btnCommand').disabled=false;
  };
  img.src=URL.createObjectURL(file);
}

/* ── AI 텍스트 인식: 버셀 서버 함수(/api/ocr) 호출 ── */
async function runAI(){
  $('loading').style.display='flex'; $('loadMsg').textContent='AI가 텍스트를 읽는 중…';
  $('layers').innerHTML=''; $('overlay').innerHTML='';
  lines=[]; linesBackup=[];
  try{
    const MAX=1568, s=Math.min(1,MAX/Math.max(canvas.width,canvas.height));
    const tmp=document.createElement('canvas');
    tmp.width=Math.round(canvas.width*s); tmp.height=Math.round(canvas.height*s);
    tmp.getContext('2d').drawImage(canvas,0,0,tmp.width,tmp.height);
    const b64=tmp.toDataURL('image/jpeg',0.9).split(',')[1];

    const res=await apiFetch('/api/ocr',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64})
    });
    const data=await res.json();
    if(data.error) throw new Error(data.error);

    lines=data.lines.map((l,i)=>({
      id:i, text:l.text, newText:'',
      bbox:{ x0:l.x/100*canvas.width, y0:l.y/100*canvas.height,
             x1:(l.x+l.w)/100*canvas.width, y1:(l.y+l.h)/100*canvas.height }
    }));
    linesBackup=cloneLines(lines);
    buildLayers();
  }catch(err){
    alert('텍스트 인식 실패: '+err.message);
  }
  $('loading').style.display='none';
}

/* ── 레이어 패널 ── */
function cloneLines(arr){
  return arr.map(l=>({id:l.id,text:l.text,newText:l.newText||'',bbox:{...l.bbox}}));
}
function removedLayers(){
  const keep=new Set(lines.map(l=>l.id));
  return linesBackup.filter(l=>!keep.has(l.id)).map(l=>({text:l.text}));
}
function sameLine(a,b){
  const ay=(a.bbox.y0+a.bbox.y1)/2, by=(b.bbox.y0+b.bbox.y1)/2;
  const ah=Math.max(8,a.bbox.y1-a.bbox.y0), bh=Math.max(8,b.bbox.y1-b.bbox.y0);
  return Math.abs(ay-by)<=Math.max(ah,bh)*0.7;
}
function overlapArea(a,b){
  const x=Math.max(0,Math.min(a.bbox.x1,b.bbox.x1)-Math.max(a.bbox.x0,b.bbox.x0));
  const y=Math.max(0,Math.min(a.bbox.y1,b.bbox.y1)-Math.max(a.bbox.y0,b.bbox.y0));
  return x*y;
}
function boxesOverlap(a,b){
  const area=overlapArea(a,b);
  if(area<8) return false;
  const minA=Math.max(1,(a.bbox.x1-a.bbox.x0)*(a.bbox.y1-a.bbox.y0));
  const minB=Math.max(1,(b.bbox.x1-b.bbox.x0)*(b.bbox.y1-b.bbox.y0));
  return area > Math.min(minA,minB)*0.18;
}
function overlapGroups(){
  const n=lines.length, p=lines.map((_,i)=>i);
  const find=i=>p[i]===i?i:(p[i]=find(p[i]));
  const uni=(i,j)=>{i=find(i);j=find(j);if(i!==j)p[j]=i;};
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) if(boxesOverlap(lines[i],lines[j])) uni(i,j);
  const map=new Map();
  lines.forEach((_,i)=>{ const r=find(i); if(!map.has(r)) map.set(r,[]); map.get(r).push(i); });
  return [...map.values()].filter(g=>g.length>=2);
}
function packJoinedGroup(idxs, joinId){
  idxs=[...idxs].sort((a,b)=>a-b);
  const boxes=idxs.map(i=>lines[i].bbox);
  const x0=Math.min(...boxes.map(b=>b.x0));
  const y0=Math.min(...boxes.map(b=>b.y0));
  const x1=Math.max(...boxes.map(b=>b.x1));
  const y1=Math.max(...boxes.map(b=>b.y1));
  const widths=idxs.map(i=>Math.max(8, lines[i].bbox.x1-lines[i].bbox.x0));
  const sumW=widths.reduce((s,w)=>s+w,0);
  const span=Math.max(8, x1-x0);
  const maxX=canvas && canvas.width ? canvas.width : x0+sumW;
  const totalW=Math.min(Math.max(sumW, span), Math.max(span, maxX-x0));
  let x=x0;
  idxs.forEach((i,n)=>{
    const w=widths[n]/sumW*totalW;
    lines[i].bbox={x0:x, y0, x1:x+w, y1};
    lines[i].joinId=joinId;
    x+=w;
  });
}
function joinOverlapping(){
  const groups=overlapGroups();
  if(!groups.length) return false;
  groups.forEach((idxs,g)=>packJoinedGroup(idxs, g+1));
  return true;
}
function refreshJoinBtn(){
  const on=overlapGroups().length>0;
  $('btnJoin').style.display=on?'block':'none';
}
function alignLineBoxes(seed){
  const group=[];
  lines.forEach((l,k)=>{ if(sameLine(l,seed)) group.push(k); });
  if(group.length<2) return;
  const boxes=group.map(k=>({...lines[k].bbox})).sort((a,b)=>a.x0-b.x0||a.y0-b.y0);
  group.forEach((k,n)=>{ lines[k].bbox=boxes[n]; });
}
function moveLayer(i,dir){
  const j=i+dir;
  if(j<0||j>=lines.length) return;
  const t=lines[i]; lines[i]=lines[j]; lines[j]=t;
  alignLineBoxes(lines[i]);
  alignLineBoxes(lines[j]);
  buildLayers();
}
function removeLayer(i){
  const l=lines[i];
  if(!l) return;
  if(!confirm('「'+l.text+'」 레이어를 삭제할까요?\n생성하면 이 글자는 이미지에서 지워집니다.')) return;
  lines.splice(i,1);
  buildLayers();
}

function buildLayers(){
  const L=$('layers'); L.innerHTML='';
  $('layerCount').textContent=lines.length+'개';
  if(!lines.length && linesBackup.length){
    L.innerHTML='<p style="color:var(--sub);font-size:12px;text-align:center;padding:28px 8px;line-height:1.7">모든 레이어를 삭제했습니다.<br>생성하면 인식된 글자가 지워집니다.<br>「원본으로 되돌리기」로 레이어를 복구할 수 있습니다.</p>';
    $('overlay').innerHTML='';
    $('btnReset').disabled=false;
    refreshJoinBtn();
    return;
  }
  lines.forEach((l,i)=>{
    const d=document.createElement('div');
    d.className='layer'+(l.newText?' edited':''); d.id='layer-'+l.id;
    d.innerHTML=`
      <div class="row">
        <span class="num">${String(l.id+1).padStart(2,'0')}</span>
        <span class="orig" title="${esc(l.text)}">${esc(l.text)}</span>
        <span class="ord">
          <button type="button" data-dir="-1" ${i===0?'disabled':''}>▲</button>
          <button type="button" data-dir="1" ${i===lines.length-1?'disabled':''}>▼</button>
        </span>
        <button type="button" class="del" title="레이어 삭제" aria-label="레이어 삭제">✕</button>
      </div>
      <input type="text" placeholder="${esc(l.text)}" data-id="${l.id}" value="${esc(l.newText||'')}">`;
    d.querySelector('input').addEventListener('input',e=>{
      l.newText=e.target.value;
      d.classList.toggle('edited',!!l.newText);
      const box=$('box-'+l.id);
      if(box) box.classList.toggle('edited',!!l.newText);
    });
    d.querySelectorAll('.ord button').forEach(btn=>{
      btn.onclick=()=>moveLayer(i, Number(btn.dataset.dir));
    });
    d.querySelector('.del').onclick=()=>removeLayer(i);
    L.appendChild(d);
  });
  drawBoxes();
  $('btnReset').disabled=false;
  refreshJoinBtn();
}

/* ── 드래그·리사이즈 가능한 박스 ── */
function drawBoxes(){
  const o=$('overlay'); o.innerHTML='';
  // overlay에 padding:3%가 있어도 절대위치 자식엔 CSS상 반영되지 않으므로,
  // 좌표 계산에 3% 안쪽 여백을 직접 반영해준다.
  const padX=canvas.clientWidth*0.03, padY=canvas.clientHeight*0.03;
  const sx=(canvas.clientWidth-padX*2)/canvas.width, sy=(canvas.clientHeight-padY*2)/canvas.height;
  lines.forEach(l=>{
    const d=document.createElement('div');
    d.className='box'+(l.newText?' edited':''); d.id='box-'+l.id;
    setBoxCss(d,l,sx,sy,padX,padY);
    d.innerHTML=`<span class="tag">${String(l.id+1).padStart(2,'0')}</span><span class="grip"></span>`;
    o.appendChild(d);
    enableDrag(d,l);
  });
}
function setBoxCss(d,l,sx,sy,padX,padY){
  const b=l.bbox;
  d.style.left=(padX+b.x0*sx)+'px'; d.style.top=(padY+b.y0*sy)+'px';
  d.style.width=((b.x1-b.x0)*sx)+'px'; d.style.height=((b.y1-b.y0)*sy)+'px';
}
function enableDrag(d,l){
  let mode=null, start=null;
  d.addEventListener('pointerdown',e=>{
    mode = e.target.classList.contains('grip') ? 'resize' : 'move';
    start={x:e.clientX,y:e.clientY,b:{...l.bbox}};
    d.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  d.addEventListener('pointermove',e=>{
    if(!mode) return;
    const padX=canvas.clientWidth*0.03, padY=canvas.clientHeight*0.03;
    const sx=(canvas.clientWidth-padX*2)/canvas.width, sy=(canvas.clientHeight-padY*2)/canvas.height;
    const dx=(e.clientX-start.x)/sx, dy=(e.clientY-start.y)/sy;
    if(mode==='move'){
      const w=start.b.x1-start.b.x0, h=start.b.y1-start.b.y0;
      l.bbox.x0=start.b.x0+dx; l.bbox.y0=start.b.y0+dy;
      l.bbox.x1=l.bbox.x0+w;   l.bbox.y1=l.bbox.y0+h;
    }else{
      l.bbox.x1=Math.max(start.b.x0+10,start.b.x1+dx);
      l.bbox.y1=Math.max(start.b.y0+10,start.b.y1+dy);
    }
    setBoxCss(d,l,sx,sy,padX,padY);
  });
  d.addEventListener('pointerup',()=>{ mode=null; if(l.joinId) delete l.joinId; refreshJoinBtn(); });
}
function boxMovedPx(a,b){
  return ['x0','y0','x1','y1'].some(k=>Math.abs(a[k]-b[k])>2);
}
function coverTextBox(ctx,src,b){
  const pad=Math.max(10,Math.round(Math.min(b.x1-b.x0,b.y1-b.y0)*0.2));
  const sx=Math.max(0,Math.floor(b.x0-pad));
  const sy=Math.max(0,Math.floor(b.y0-pad));
  const ex=Math.min(src.width,Math.ceil(b.x1+pad));
  const ey=Math.min(src.height,Math.ceil(b.y1+pad));
  const sw=ex-sx, sh=ey-sy;
  if(sw<2||sh<2) return;
  const blur=document.createElement('canvas');
  blur.width=sw; blur.height=sh;
  const bx=blur.getContext('2d');
  bx.filter='blur('+Math.max(8,Math.round(pad*0.9))+'px)';
  bx.drawImage(src,sx,sy,sw,sh,0,0,sw,sh);
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);
  ctx.clip();
  ctx.drawImage(blur,sx,sy);
  ctx.restore();
}
function cropBox(src,b){
  const x=Math.max(0,Math.floor(b.x0));
  const y=Math.max(0,Math.floor(b.y0));
  const w=Math.max(1,Math.min(src.width-x,Math.ceil(b.x1)-x));
  const h=Math.max(1,Math.min(src.height-y,Math.ceil(b.y1)-y));
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  c.getContext('2d').drawImage(src,x,y,w,h,0,0,w,h);
  return c;
}
/* 원문 픽셀(색·3D 효과)을 현재 레이어 박스로 옮긴 뒤 AI에 넘긴다. 효과가 자리가 아니라 레이어를 따라가게. */
function prepareStyledSource(){
  const src=document.createElement('canvas');
  src.width=img.naturalWidth; src.height=img.naturalHeight;
  const cx=src.getContext('2d');
  cx.drawImage(img,0,0);
  const keep=new Set(lines.map(l=>l.id));
  const erase=[];
  const paste=[];
  linesBackup.forEach(orig=>{ if(!keep.has(orig.id)) erase.push(orig.bbox); });
  lines.forEach(l=>{
    const orig=linesBackup.find(b=>b.id===l.id);
    if(!orig) return;
    if(boxMovedPx(l.bbox,orig.bbox)){
      erase.push(orig.bbox);
      paste.push({crop:cropBox(img,orig.bbox),to:l.bbox});
    }
  });
  erase.forEach(b=>coverTextBox(cx,img,b));
  paste.forEach(p=>{
    const t=p.to;
    cx.drawImage(p.crop,0,0,p.crop.width,p.crop.height,t.x0,t.y0,t.x1-t.x0,t.y1-t.y0);
  });
  return src;
}

/* ── AI 생성 모드: 배너 전체를 한 번에 번역 생성 (글자 정확도·안정성 우선) ──
   모델은 최대 21:9까지만 만들 수 있어 초광폭 배너는 좁게 나온다.
   → 생성물을 흐리게 늘려 배경으로 깔고(양옆 채움), 그 위에 원비율 생성물을
     또렷하게 얹는다. 원본 한글·줄무늬·테두리 없이 자연스럽게 폭을 채운다. ── */
$('cmdLang').onchange=()=>{ const c=$('cmdLang').value==='__custom__'; $('cmdInput').style.display=c?'block':'none'; if(c) $('cmdInput').focus(); };
$('btnJoin').onclick=()=>{ if(joinOverlapping()){ buildLayers(); } };
$('btnCommand').onclick=async()=>{
  const sel=$('cmdLang').value;
  const instruction = sel==='__custom__' ? $('cmdInput').value.trim() : sel;
  const removed=removedLayers();
  if(!linesBackup.length){ alert('먼저 이미지를 업로드해 텍스트 레이어 인식이 끝난 뒤 사용해주세요.'); return; }
  if(!lines.length && !removed.length){ alert('남길 레이어가 없습니다. 레이어를 두거나, 지울 글자를 삭제한 뒤 생성해주세요.'); return; }
  const hasTyped=lines.some(l=>l.newText&&l.newText.trim());
  if(lines.length && !instruction && !hasTyped){ alert('언어를 지정하거나(예: 영어로), 레이어에 번역문을 직접 입력해주세요.'); return; }
  $('loading').style.display='flex';
  $('loadMsg').textContent='AI가 이미지를 생성 중… (20~40초)';
  try{
    joinOverlapping();
    buildLayers();
    // 입력용 축소 사본 (원본 캔버스는 그대로 유지)
    const styled=prepareStyledSource();
    const MAX=2560, s0=Math.min(1,MAX/Math.max(styled.width,styled.height));
    const tmp=document.createElement('canvas');
    tmp.width=Math.round(styled.width*s0); tmp.height=Math.round(styled.height*s0);
    tmp.getContext('2d').drawImage(styled,0,0,tmp.width,tmp.height);
    const b64=tmp.toDataURL('image/jpeg',0.92).split(',')[1];
    const layers=lines.map(l=>{
      const orig=linesBackup.find(b=>b.id===l.id);
      return {
        text:l.text,newText:l.newText||'',
        x0:l.bbox.x0/canvas.width*100,
        y0:l.bbox.y0/canvas.height*100,
        x1:l.bbox.x1/canvas.width*100,
        y1:l.bbox.y1/canvas.height*100,
        ox0:orig?orig.bbox.x0/canvas.width*100:null,
        oy0:orig?orig.bbox.y0/canvas.height*100:null,
        ox1:orig?orig.bbox.x1/canvas.width*100:null,
        oy1:orig?orig.bbox.y1/canvas.height*100:null,
        joinId:l.joinId||null
      };
    });
    const res=await apiFetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64,instruction,imgW:canvas.width,imgH:canvas.height,layers,removed,usage:imageJob})});
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    const gi=await loadImg('data:'+data.mime+';base64,'+data.image);
    compositeWide(gi);
    $('btnDownload').style.display='block';
    $('overlay').style.display='none';
  }catch(err){ alert('생성 실패: '+err.message); }
  $('loading').style.display='none';
};

/* 21:9까지만 나오는 생성 이미지를 원본 폭(초광폭)에 맞춰 합성 */
function compositeWide(gi){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // 위아래 흰 여백(레터박스)만 제거, 좌우는 그대로
  const {sx,sy,sw,sh}=autoCrop(gi);
  const dw=sw*(canvas.height/sh);       // 높이에 맞췄을 때의 폭
  if(dw>=canvas.width*0.97){
    // 배너 비율이 캔버스와 (거의) 같음 → 캔버스에 꽉 채워 전체화면 (미세 비율차는 무시, 끝 잘림·여백 없음)
    ctx.drawImage(gi, sx,sy,sw,sh, 0,0, canvas.width,canvas.height);
  }else{
    // 배너가 더 좁음(모델이 재구성한 경우) → 가운데 또렷 + 양옆만 blur
    ctx.save();
    ctx.filter='blur('+Math.max(12,Math.round(canvas.height*0.05))+'px)';
    const cov=Math.max(canvas.width/sw, canvas.height/sh)*1.3;
    ctx.drawImage(gi, sx,sy,sw,sh, (canvas.width-sw*cov)/2,(canvas.height-sh*cov)/2, sw*cov,sh*cov);
    ctx.restore();
    ctx.drawImage(gi, sx,sy,sw,sh, (canvas.width-dw)/2,0, dw,canvas.height);
  }
}

/* 생성 이미지에서 모델이 덧댄 '위아래 흰 여백(레터박스)'을 감지해 잘라냄 (좌우는 건드리지 않음) */
function autoCrop(gi){
  const c=document.createElement('canvas'); c.width=gi.width; c.height=gi.height;
  const cx=c.getContext('2d'); cx.drawImage(gi,0,0);
  let data;
  try{ data=cx.getImageData(0,0,c.width,c.height).data; }
  catch(e){ return {sx:0,sy:0,sw:gi.width,sh:gi.height}; }
  const W=c.width, H=c.height;
  const white=i=> data[i]>235 && data[i+1]>235 && data[i+2]>235;   // 거의 흰색인 픽셀
  const rowWhite=y=>{ for(let x=0;x<W;x+=6) if(!white((y*W+x)*4)) return false; return true; }; // 가로 한 줄이 통째로 흰색이면 여백
  let top=0, bot=H-1;
  while(top<bot && rowWhite(top)) top++;
  while(bot>top && rowWhite(bot)) bot--;
  if(top>0) top=Math.min(top+2,H-1);       // 흰 여백을 실제로 잘랐을 때만 잔여 2px 추가 제거
  if(bot<H-1) bot=Math.max(bot-2,top);
  return {sx:0, sy:top, sw:W, sh:Math.max(1,bot-top+1)};   // 좌우(sx=0, sw=전체)는 그대로 유지
}

function loadImg(src){ return new Promise((ok,bad)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=bad; im.src=src; }); }

/* ── 되돌리기 / 다운로드 ── */
$('btnReset').onclick=()=>{
  ctx.drawImage(img,0,0);
  lines=cloneLines(linesBackup).map(l=>({...l,newText:''}));
  buildLayers();
  $('overlay').style.display='block';
  $('btnDownload').style.display='none';
};

$('btnDownload').onclick=()=>{
  const a=document.createElement('a');
  a.download=originalName+'_edited.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
